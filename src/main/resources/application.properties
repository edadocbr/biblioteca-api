spring.application.name=biblioteca-api

# =============
# CONEXIÓN A BD
# =============
spring.datasource.url=jdbc:mysql://localhost:3306/sgbu_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=edgar
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto SQL compatible con MySQL 8 e InnoDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Muestra las consultas SQL ejecutadas en la terminal (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

# Servidor
server.port=8080
